        '503':
          $ref: '#/components/responses/Timeout'
  /alert/{slackChannelId}:
    post:
      tags: [Alerts]
      operationId: sendAlertsToChannelLegacyAlert
      summary: Send alerts to a channel (deprecated alias)
      description: Deprecated alias for `POST /alerts/{slackChannelId}`, kept for legacy clients.
      deprecated: true

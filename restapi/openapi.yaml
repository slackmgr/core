openapi: 3.1.0

info:
  title: Slack Manager REST API
  version: 0.32.0
  summary: Send alerts to Slack Manager, which groups them into issues in Slack channels.
  description: |
    The REST API of the Slack Manager core library (`github.com/slackmgr/core/restapi`). It accepts alerts
    from monitoring systems and other clients, validates and routes them to a Slack channel, and queues them
    for the manager, which creates and updates issues in Slack.

    The API is embedded in a host application, so the base URL and port depend on the deployment. The
    default port is 8080.

    ## Authentication

    Authentication is optional, and disabled by default: all endpoints are then open. When the deployment
    enables it, all endpoints except `GET /ping` and `GET /openapi.yaml` require credentials:

    - An API key, sent as a bearer token (`Authorization: Bearer <key>`), or as the password of HTTP basic
      authentication (the username is ignored)
    - A token accepted by a custom authenticator of the deployment (e.g. an OIDC access token), sent as a
      bearer token

    Each protected endpoint requires a scope, listed in its security requirements: `alerts:write` (send
    alerts), `alerts:test` (test alerts) or `config:read` (read routing rules and channels). The scope `*`
    grants all scopes. Requests without valid credentials are rejected with HTTP 401, and requests whose
    credentials lack the scope with HTTP 403. In permissive mode (used while migrating clients), requests
    without any credentials (no `Authorization` header) are let through. An `Authorization` header that the
    server does not accept, including an unsupported scheme, always gets HTTP 401.

    The deployment may also restrict the Slack channels an authenticated caller may send alerts to. The
    channel of each alert (after routing) and every escalation `moveToChannel` must be allowed, otherwise the
    whole request is rejected with HTTP 403 and no alert is queued. Malformed channels, and more escalations
    than allowed, are rejected with HTTP 400 before this check.
    The check applies when an alert is received: alerts for an issue that was moved out of an allowed channel
    (by a Slack user or an escalation) still update the issue in its new channel.

    ## Routing

    The Slack channel of an alert is determined in this order:

    1. The `slackChannelId` field in the alert body
    2. The `slackChannelId` path parameter (for the endpoints that have one)
    3. A routing rule matching the alert `routeKey` (and `type`)
    4. The fallback routing rule, if the alert has no route key

    Channel names are accepted in place of channel IDs, and are mapped to IDs by the API (for channels that
    the Slack Manager integration is a member of).

    ## Rate limiting

    Alerts are rate limited per Slack channel with a token bucket. A request is accepted or rejected as a
    whole: if any channel in the request has too few tokens left, the request is rejected with HTTP 429 and
    no alert is queued. All alerts and channels are validated before the rate limit is checked, so a
    rejected request can be retried without duplicating alerts. Accepted and rate limited requests get
    `RateLimit-*` headers (IETF `draft-ietf-httpapi-ratelimit-headers-11`) for the most constrained channel
    in the request.

    ## Errors

    All error responses have a JSON body with a single `error` field. Requests that take longer than 30
    seconds are aborted with HTTP 503.

    This document is the source of truth for the API contract. It is served by the API itself at
    `GET /openapi.yaml`.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Slack Manager
    url: https://github.com/slackmgr/core

externalDocs:
  description: Slack Manager core README
  url: https://github.com/slackmgr/core#readme

servers:
  - url: http://localhost:8080
    description: Local instance on the default port

tags:
  - name: Alerts
    description: Send alerts in the native Slack Manager format.
  - name: Prometheus
    description: Receive Prometheus Alertmanager webhooks.
  - name: Testing
    description: Endpoints for testing clients and integrations. Nothing is sent to Slack.
  - name: Information
    description: Read routing rules and managed channels.
  - name: Operations
    description: Health checks and API metadata.

paths:
  /alerts:
    post:
      tags: [Alerts]
      operationId: sendAlerts
      summary: Send alerts
      description: |
        Validates, routes and queues one or more alerts, sent in an `alerts` array.

        For compatibility, the API also accepts a single alert or a root level array of alerts here, as
        documented for the deprecated aliases (e.g. `POST /alert`). New clients should use the `alerts` array.

        The request is accepted or rejected as a whole: if any alert fails validation, routing or the rate
        limit, no alert in the request is queued. Only a queue error can fail a request after some of its
        alerts have been queued.
      requestBody:
        $ref: '#/components/requestBodies/AlertBatch'
      security:
        - bearerAuth: [alerts:write]
        - basicAuth: [alerts:write]
        - {}
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '204':
          $ref: '#/components/responses/AllIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Timeout'
  /alerts/{slackChannelId}:
    post:
      tags: [Alerts]
      operationId: sendAlertsToChannel
      summary: Send alerts to a channel
      description: |
        Same as `POST /alerts`, but alerts without a `slackChannelId` in the body are sent to the channel in
        the path, instead of being routed by their route key.
      parameters:
        - $ref: '#/components/parameters/SlackChannelID'
      requestBody:
        $ref: '#/components/requestBodies/AlertBatch'
      security:
        - bearerAuth: [alerts:write]
        - basicAuth: [alerts:write]
        - {}
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '204':
          $ref: '#/components/responses/AllIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Timeout'


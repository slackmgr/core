  /prometheus-alert:
    post:
      tags: [Prometheus]
      operationId: sendPrometheusWebhook
      summary: Receive a Prometheus Alertmanager webhook
      description: |
        Maps each alert in an Alertmanager webhook (version 4) to a Slack Manager alert, and processes them
        like `POST /alerts`.

        Alert fields are read from the annotations and labels of each Prometheus alert (case-insensitive,
        annotations take precedence over labels). The first key found is used:

        | Alert field | Keys |
        |---|---|
        | `correlationId` | `correlationId`, `correlation_id` (default: a hash of selected labels, or of the group key and start time) |
        | `type` | `alertType`, `alert_type`, `type` |
        | `header` | `header`, `title`, `summary` (default: `Prometheus alert`) |
        | `text` | `text`, `description`, `body` |
        | `fallbackText` | `fallbackText` (default: the header) |
        | `author`, `host`, `footer`, `link`, `username` | same name |
        | `client` | `slackmgrClient`, `slackmgr_client` |
        | `iconEmoji` | `iconEmoji`, `icon` |
        | `severity` | `severity`, `level` (default and `critical`: `error`; `resolved` if the alert status is resolved) |
        | `slackChannelId` | `slackChannelId`, `channel`, `slackChannel`, `channelId`, `slack_channel_id`, `slack_channel`, `channel_id` |
        | `routeKey` | `routeKey`, `route`, `route_key` |
        | `autoResolveSeconds` | `autoResolveSeconds` (default and below 30: 3600) |
        | `autoResolveAsInconclusive` | `autoResolveAsInconclusive` (default: `true`) |
        | `issueFollowUpEnabled` | `issueFollowUpEnabled` (default: `true`) |
        | `notificationDelaySeconds` | `notificationDelaySeconds` (default: 0) |
        | `archivingDelaySeconds` | `archivingDelaySeconds`, `deletionDelaySeconds` (default: 21600) |
        | `ignoreIfTextContains` | `ignoreIfTextContains` (a single term) |

        If neither the header nor the text contains `:status:`, it is prepended to the header.
      requestBody:
        $ref: '#/components/requestBodies/PrometheusWebhook'
      security:
        - bearerAuth: [alerts:write]
        - basicAuth: [alerts:write]
        - {}
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '204':
          $ref: '#/components/responses/AllIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Timeout'
  /prometheus-alert/{slackChannelId}:
    post:
      tags: [Prometheus]
      operationId: sendPrometheusWebhookToChannel
      summary: Receive a Prometheus Alertmanager webhook for a channel
      description: |
        Same as `POST /prometheus-alert`, but alerts without a channel in their annotations or labels are
        sent to the channel in the path, instead of being routed by their route key.
      parameters:
        - $ref: '#/components/parameters/SlackChannelID'
      requestBody:
        $ref: '#/components/requestBodies/PrometheusWebhook'
      security:

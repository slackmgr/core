name: Code Scanning

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/code-scanning.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/code-scanning.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gosec:
    name: GoSec
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Read Go version
      id: go-version
      run: |
        version=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1/p' go.mod)
        if [ -z "$version" ]; then echo "::error::Could not read Go version from go.mod"; exit 1; fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        check-latest: true
        cache: true
        cache-dependency-path: 'go.sum'

    - name: Install gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest

    - name: Run Gosec Security Scanner
      run: gosec -no-fail -fmt sarif -out results.sarif ./...

    - name: Upload Gosec results
      if: always()
      uses: github/codeql-action/upload-sarif@v4.39.0
      with:
        sarif_file: results.sarif

  govulncheck:
    name: GoVulncheck
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Read Go version
      id: go-version
      run: |
        version=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1/p' go.mod)
        if [ -z "$version" ]; then echo "::error::Could not read Go version from go.mod"; exit 1; fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ steps.go-version.outputs.version }}
        check-latest: true
        cache: true
        cache-dependency-path: 'go.sum'

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      run: govulncheck -format sarif ./... > vuln.sarif || true

    - name: Upload govulncheck results
      if: always()
      uses: github/codeql-action/upload-sarif@v4.39.0
      with:
        sarif_file: vuln.sarif
